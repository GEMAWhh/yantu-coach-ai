[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yantu-coach-api"
version = "0.1.0"
description = "Local-first API for Yantu Coach"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "alembic==1.14.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.3.5",
  "uvicorn[standard]==0.32.1"
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.8.4"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
