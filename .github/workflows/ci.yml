name: CI
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend checks when project exists
        shell: bash
        run: |
          if [ -f apps/api/pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install -e 'apps/api[dev]'
            ruff format --check apps/api
            ruff check apps/api
            mypy apps/api/app apps/api/tests
            pytest apps/api
          else
            echo 'Backend project not bootstrapped yet.'
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend checks when project exists
        shell: bash
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web
            npm ci
            npm run typecheck
            npm run lint
            npm run test:unit --if-present
            npm run build
          else
            echo 'Frontend project not bootstrapped yet.'
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright E2E when project exists
        shell: bash
        run: |
          if [ -f apps/web/playwright.config.ts ]; then
            cd apps/web
            npm ci
            npx playwright install --with-deps chromium
            npm run test:e2e
          else
            echo 'Playwright not bootstrapped yet.'
          fi
